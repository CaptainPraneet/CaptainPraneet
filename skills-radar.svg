<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
      .label { fill: #CCD6F6; font-size: 16px; font-weight: 600; }
      .pct { fill: #64FFDA; font-size: 12px; font-weight: 400; }
      .titleTxt { fill: #CCD6F6; font-size: 26px; font-weight: 700; letter-spacing: 4px; }
      .subTxt { fill: #8892B0; font-size: 13px; letter-spacing: 3px; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes ping {
        0%   { r: 5;  opacity: 0.9; }
        70%  { r: 26; opacity: 0; }
        100% { r: 26; opacity: 0; }
      }
      @keyframes pulseDot { 0%,100% { opacity:0.6; } 50% { opacity:1; } }
      .sweep { transform-origin: 450px 280px; animation: spin 5s linear infinite; }
      .ring1 { animation: ping 3s ease-out infinite; }
      .ring2 { animation: ping 3s ease-out infinite; animation-delay: .6s; }
      .ring3 { animation: ping 3s ease-out infinite; animation-delay: 1.2s; }
      .ring4 { animation: ping 3s ease-out infinite; animation-delay: 1.8s; }
      .ring5 { animation: ping 3s ease-out infinite; animation-delay: 2.4s; }
      .ring6 { animation: ping 3s ease-out infinite; animation-delay: .3s; }
      .ring7 { animation: ping 3s ease-out infinite; animation-delay: .9s; }
      .dot { animation: pulseDot 2.4s ease-in-out infinite; }
    </style>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="0"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="900" height="560" rx="18" fill="url(#bgGlow)"/>
  <rect x="1" y="1" width="898" height="558" rx="17" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <text x="450" y="42" text-anchor="middle" class="mono titleTxt">TECH RADAR</text>
  <text x="450" y="64" text-anchor="middle" class="mono subTxt">SIGNAL STRENGTH // SKILL SCAN</text>

  <!-- concentric rings -->
  <g stroke="#1E3A5F" fill="none">
    <circle cx="450" cy="280" r="50"/>
    <circle cx="450" cy="280" r="100"/>
    <circle cx="450" cy="280" r="150"/>
    <circle cx="450" cy="280" r="200"/>
  </g>

  <!-- spokes -->
  <g stroke="#1E3A5F">
    <line x1="450" y1="280" x2="450" y2="80"/>
    <line x1="450" y1="280" x2="624.9" y2="155.9"/>
    <line x1="450" y1="280" x2="645.0" y2="324.9"/>
    <line x1="450" y1="280" x2="527.8" y2="460.4"/>
    <line x1="450" y1="280" x2="372.2" y2="460.4"/>
    <line x1="450" y1="280" x2="255.0" y2="324.9"/>
    <line x1="450" y1="280" x2="275.1" y2="155.9"/>
  </g>

  <!-- rotating radar sweep -->
  <g class="sweep">
    <path d="M450,280 L450,80 A200,200 0 0,1 624.9,155.9 Z" fill="url(#sweepGrad)"/>
  </g>
  <circle cx="450" cy="280" r="200" fill="none" stroke="#64FFDA" stroke-opacity="0.25"/>

  <!-- skill signature polygon -->
  <polygon points="450,236.4 489.4,248.6 495.8,290.5 477.8,337.7 419.3,343.8 374.3,297.3 370.7,216.8"
           fill="#64FFDA" fill-opacity="0.12" stroke="#64FFDA" stroke-width="2" stroke-opacity="0.7"/>

  <!-- blips with ping rings -->
  <g>
    <circle class="ring1" cx="450.0" cy="236.4" r="5" fill="none" stroke="#64FFDA" stroke-width="1.5"/>
    <circle class="dot" cx="450.0" cy="236.4" r="5" fill="#64FFDA"/>

    <circle class="ring2" cx="489.4" cy="248.6" r="5" fill="none" stroke="#64FFDA" stroke-width="1.5"/>
    <circle class="dot" cx="489.4" cy="248.6" r="5" fill="#64FFDA"/>

    <circle class="ring3" cx="495.8" cy="290.5" r="5" fill="none" stroke="#64FFDA" stroke-width="1.5"/>
    <circle class="dot" cx="495.8" cy="290.5" r="5" fill="#64FFDA"/>

    <circle class="ring4" cx="477.8" cy="337.7" r="5" fill="none" stroke="#FFB454" stroke-width="1.5"/>
    <circle class="dot" cx="477.8" cy="337.7" r="5" fill="#FFB454"/>

    <circle class="ring5" cx="419.3" cy="343.8" r="5" fill="none" stroke="#FFB454" stroke-width="1.5"/>
    <circle class="dot" cx="419.3" cy="343.8" r="5" fill="#FFB454"/>

    <circle class="ring6" cx="374.3" cy="297.3" r="5" fill="none" stroke="#FFB454" stroke-width="1.5"/>
    <circle class="dot" cx="374.3" cy="297.3" r="5" fill="#FFB454"/>

    <circle class="ring7" cx="370.7" cy="216.8" r="5" fill="none" stroke="#64FFDA" stroke-width="1.5"/>
    <circle class="dot" cx="370.7" cy="216.8" r="5" fill="#64FFDA"/>
  </g>

  <!-- labels -->
  <g class="mono">
    <text x="450.0" y="45.0" text-anchor="middle" class="label">DOCKER</text>
    <text x="450.0" y="62.0" text-anchor="middle" class="pct">92%</text>

    <text x="633.7" y="129.5" text-anchor="start" class="label">LINUX</text>
    <text x="633.7" y="146.5" text-anchor="start" class="pct">88%</text>

    <text x="679.1" y="328.3" text-anchor="start" class="label">GIT</text>
    <text x="679.1" y="345.3" text-anchor="start" class="pct">90%</text>

    <text x="552.0" y="487.7" text-anchor="middle" class="label">JENKINS</text>
    <text x="552.0" y="504.7" text-anchor="middle" class="pct">80%</text>

    <text x="348.0" y="487.7" text-anchor="middle" class="label">KUBERNETES</text>
    <text x="348.0" y="504.7" text-anchor="middle" class="pct">76%</text>

    <text x="220.9" y="328.3" text-anchor="end" class="label">AWS</text>
    <text x="220.9" y="345.3" text-anchor="end" class="pct">72%</text>

    <text x="266.3" y="129.5" text-anchor="end" class="label">TERRAFORM</text>
    <text x="266.3" y="146.5" text-anchor="end" class="pct">58%</text>
  </g>
</svg>
