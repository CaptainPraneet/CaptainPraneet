<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .miniSweep { transform-origin: 1080px 78px; animation: spin 4s linear infinite; }

      @keyframes ping {
        0%   { r: 4;  opacity: .9; }
        70%  { r: 20; opacity: 0; }
        100% { r: 20; opacity: 0; }
      }
      .blipA { animation: ping 2.6s ease-out infinite; }
      .blipB { animation: ping 2.6s ease-out infinite; animation-delay: .9s; }
      .blipC { animation: ping 2.6s ease-out infinite; animation-delay: 1.7s; }

      @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .statusLine { animation: breathe 3s ease-in-out infinite; }

      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .cursor { animation: blink 1s steps(1) infinite; }

      @keyframes typeReveal { from { width: 0; } to { width: 520px; } }
      .typeMask { animation: typeReveal 2.6s steps(34, end) 1 forwards; }

      @keyframes flutter {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-10deg); }
      }
      .pennant { transform-origin: 1010px 58px; animation: flutter 1.6s ease-in-out infinite; }

      @keyframes wave {
        from { transform: translateX(0); }
        to   { transform: translateX(-120px); }
      }
      .waterLayer { animation: wave 6s linear infinite; }

      @keyframes sail {
        from { transform: translate(-260px, 198px); }
        to   { transform: translate(1300px, 198px); }
      }
      .ship { animation: sail 17s linear infinite; }

      @keyframes bob {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-4px); }
      }
      .bobber { animation: bob 2.2s ease-in-out infinite; }

      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(100,255,218,.55)); }
        50%      { filter: drop-shadow(0 0 14px rgba(100,255,218,.9)); }
      }
      .glowTitle { animation: glowPulse 3.2s ease-in-out infinite; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#112240"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16314F"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E3A5F" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <linearGradient id="sweepGradMini" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="0"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#gridPattern)"/>

  <!-- ocean -->
  <rect x="0" y="230" width="1200" height="90" fill="url(#waterGrad)"/>
  <line x1="0" y1="230" x2="1200" y2="230" stroke="#64FFDA" stroke-opacity="0.3" stroke-width="1"/>
  <g class="waterLayer" opacity="0.35">
    <path d="M-120,238 Q -90,232 -60,238 T 0,238 T 60,238 T 120,238 T 180,238 T 240,238 T 300,238 T 360,238 T 420,238 T 480,238 T 540,238 T 600,238 T 660,238 T 720,238 T 780,238 T 840,238 T 900,238 T 960,238 T 1020,238 T 1080,238 T 1140,238 T 1200,238 T 1260,238 T 1320,238"
          fill="none" stroke="#64FFDA" stroke-width="1.2"/>
  </g>

  <!-- sailing ship carrying containers -->
  <g class="ship">
    <g class="bobber">
      <!-- hull -->
      <path d="M0,40 L170,40 L155,58 L15,58 Z" fill="#16314F" stroke="#64FFDA" stroke-opacity="0.5" stroke-width="1"/>
      <!-- mast -->
      <line x1="100" y1="40" x2="100" y2="-6" stroke="#8892B0" stroke-width="2"/>
      <!-- pennant flag -->
      <path class="pennant" d="M100,-6 L122,2 L100,10 Z" fill="#FFB454"/>
      <!-- containers -->
      <rect x="8" y="14" width="40" height="26" rx="3" fill="#0A192F" stroke="#64FFDA" stroke-width="1.5"/>
      <text x="28" y="31" text-anchor="middle" class="mono" font-size="8" fill="#64FFDA">DOCKER</text>

      <rect x="58" y="14" width="40" height="26" rx="3" fill="#0A192F" stroke="#FFB454" stroke-width="1.5"/>
      <text x="78" y="31" text-anchor="middle" class="mono" font-size="8" fill="#FFB454">JENKINS</text>

      <rect x="118" y="14" width="40" height="26" rx="3" fill="#0A192F" stroke="#64FFDA" stroke-width="1.5"/>
      <text x="138" y="31" text-anchor="middle" class="mono" font-size="7.5" fill="#64FFDA">K8S</text>
    </g>
  </g>

  <!-- mini radar, top right -->
  <g>
    <circle cx="1080" cy="78" r="50" fill="none" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="1080" cy="78" r="32" fill="none" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="1080" cy="78" r="14" fill="none" stroke="#1E3A5F" stroke-width="1"/>
    <g class="miniSweep">
      <path d="M1080,78 L1080,28 A50,50 0 0,1 1123.3,53 Z" fill="url(#sweepGradMini)"/>
    </g>
    <circle class="blipA" cx="1098" cy="60" r="4" fill="none" stroke="#64FFDA" stroke-width="1.3"/>
    <circle cx="1098" cy="60" r="3" fill="#64FFDA"/>
    <circle class="blipB" cx="1062" cy="95" r="4" fill="none" stroke="#FFB454" stroke-width="1.3"/>
    <circle cx="1062" cy="95" r="3" fill="#FFB454"/>
    <circle class="blipC" cx="1100" cy="100" r="4" fill="none" stroke="#64FFDA" stroke-width="1.3"/>
    <circle cx="1100" cy="100" r="3" fill="#64FFDA"/>
    <text x="1080" y="146" text-anchor="middle" class="mono" font-size="10" fill="#8892B0" letter-spacing="2">21.17N 72.83E</text>
  </g>

  <!-- title -->
  <g class="glowTitle">
    <text x="58" y="140" class="mono" font-size="52" font-weight="800" fill="#CCD6F6" letter-spacing="2">CAPTAIN PRANEET</text>
  </g>

  <!-- typed subtitle -->
  <g>
    <clipPath id="typeClip">
      <rect x="58" y="155" width="520" height="30" class="typeMask"/>
    </clipPath>
    <text x="58" y="178" class="mono" font-size="22" fill="#64FFDA" letter-spacing="1" clip-path="url(#typeClip)">&gt; Aspiring DevOps Engineer_</text>
    <rect class="cursor" x="498" y="160" width="10" height="22" fill="#64FFDA"/>
  </g>

  <!-- status readout -->
  <text x="58" y="220" class="mono statusLine" font-size="13" fill="#8892B0" letter-spacing="1">STATUS: ONLINE &#160;|&#160; PIPELINE: ACTIVE &#160;|&#160; FLEET: DOCKER × KUBERNETES × JENKINS</text>

  <!-- bottom border accent -->
  <rect x="0" y="316" width="1200" height="4" fill="#64FFDA" opacity="0.5"/>
</svg>
